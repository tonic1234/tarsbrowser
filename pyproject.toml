[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarsbrowser"
version = "1.3.0"
description = "Maneja un Chrome propio por CDP a través de SSH: búsquedas, descargas, capturas y login, con cursor dibujado."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Antonio Rama" }]
dependencies = ["websockets>=12"]

[project.scripts]
tarsbrowser = "tarsbrowser:main"

[tool.setuptools]
py-modules = ["tarsbrowser"]
include-package-data = true

[tool.setuptools.data-files]
"." = ["cursor.js"]
