name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencias
        run: python -m pip install websockets
      - name: Tests sin red
        run: python -m unittest discover -s tests -v
      - name: Sintaxis del cliente
        run: python -c "import ast,sys; ast.parse(open('tarsbrowser.py', encoding='utf-8').read()); print('ok')"
